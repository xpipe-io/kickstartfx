def distDir = "${project.layout.buildDirectory.get()}/dist"

// AOT adapter caching is disabled with -XX:+UnlockDiagnosticVMOptions -XX:-AOTAdapterCaching
// as adapters are generated for the CPU features of the machine that creates the AOT cache
// Without this, the app will crash on systems that do not support the same set of CPU features as the training machine
// This isn't even really documented anywhere

tasks.register('trainAot', DefaultTask) {
    doLast {
        def properties = [
                "-D" + propertyName("dataDir") + "=$distDir/local_train",
                "-D" + propertyName("aotTrainMode") + "=true",
                "-D" + propertyName("writeSysOut") + "=true",
                "-D" + propertyName("writeLogs") + "=false",
                "-D" + propertyName("logLevel") + "=trace",
                "-D" + propertyName("useVirtualThreads") + "=false",
        ]

        def jvmName = System.getProperty("java.vendor.version")
        def graal = jvmName != null && jvmName.toLowerCase().contains("graal")

        def imageDir
        def command
        // The cache output location is relative to the working directory of the launcher script
        def cacheOutput
        def cfgFile
        // The cache location as seen from the launcher configuration
        def cfgCache
        if (os.isWindows()) {
            imageDir = "$distDir/base"
            command = ['cmd', '/c', "$imageDir/runtime/bin/${jpackageExecutableName}.bat"]
            cacheOutput = './server/cache.aot'
            cfgFile = "$imageDir/app/${jpackageExecutableName}.cfg"
            cfgCache = '$ROOTDIR/runtime/bin/server/cache.aot'
        } else if (os.isLinux()) {
            imageDir = "$distDir/base"
            command = ["$imageDir/lib/runtime/bin/${jpackageExecutableName}"]
            cacheOutput = './lib/runtime/lib/server/cache.aot'
            cfgFile = "$imageDir/lib/app/${jpackageExecutableName}.cfg"
            cfgCache = '$APPDIR/../../lib/runtime/lib/server/cache.aot'
        } else {
            imageDir = "$distDir/${productName}.app"
            command = ["$imageDir/Contents/runtime/Contents/Home/bin/${jpackageExecutableName}"]
            cacheOutput = './Contents/runtime/Contents/Home/lib/server/cache.aot'
            cfgFile = "$imageDir/Contents/app/${jpackageExecutableName}.cfg"
            cfgCache = '$ROOTDIR/Contents/runtime/Contents/Home/lib/server/cache.aot'
        }

        def jvmOptions = [
                "-XX:+UnlockDiagnosticVMOptions",
                "-XX:-AOTAdapterCaching",
                "-XX:+AOTClassLinking",
                "-XX:AOTCacheOutput=$cacheOutput",
                "-Xlog:aot",
        ]
        if (graal) {
            jvmOptions += ["--add-modules", "jdk.internal.vm.ci"]
        }

        execOps.exec {
            commandLine((command + properties).collect { it.toString() })
            workingDir imageDir
            environment "CDS_JVM_OPTS", jvmOptions.join(" ")
        }

        def cfg = file(cfgFile)
        cfg.text = cfg.text + "java-options=-XX:AOTCache=$cfgCache\n"

        delete(project.file("$distDir/local_train"))
    }
}
